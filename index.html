rD:`<p>Chaque jour à minuit (heure française), cinq nouveaux défis : Le mot le plus long en français et en anglais (30 secondes), Le compte est bon (45 secondes), Les mots de la fin en français et en anglais (2 minutes).</p><p>Le tirage est le même pour tous les joueurs et chaque défi ne se joue qu'une seule fois. Pour Le mot le plus long, le tirage contient toujours au moins un mot de 10 lettres.</p><p>Classements : Le mot le plus long au mot le plus long trouvé, Le compte est bon au résultat le plus proche de la cible, Les mots de la fin au nombre de mots trouvés. En cas d'égalité, le plus rapide passe devant, au centième de seconde près (temps de validation du mot, temps du meilleur calcul, temps du dernier mot trouvé).</p><p>Après avoir joué, tu découvres sous le classement le tirage du jour et les solutions. Si tu n'as pas encore joué, seul le classement est visible. Le tirage et les solutions de la veille sont visibles par tous dans l'onglet Hier.</p><p>Classements : le top 10 de tous les joueurs qui ont un compte, et le classement entre amis. En invité, tu peux jouer mais ton résultat n'est pas classé.</p>`,

rW:`<p>Huit mots mélangés à retrouver : 5, 6, 7 et 8 lettres, puis encore 5, 6, 7 et 8 lettres.</p><p>Tu as 2 minutes pour toute la partie. Tape ta réponse ou touche les lettres (chaque lettre une seule fois). Chaque mot juste rapporte 1 point par lettre.</p><p>Tu peux passer un mot et y revenir plus tard. Les réponses s'affichent quand la musique est terminée.</p><p>Avant la partie, choisis le dictionnaire : français ou anglais.</p>`,
rL:`<p>Dix lettres sont tirées : à chaque tirage, tu choisis voyelle ou consonne (au moins 2 de chaque).</p><p>Tu as 30 secondes pour former le mot le plus long possible, chaque lettre une seule fois. Touche Valider pour proposer ton mot : la manche s'arrête et ton mot rapporte 1 point par lettre.</p><p>À la fin, le plus long mot possible du dictionnaire est révélé. Dictionnaire français ou anglais au choix.</p>`,
rC:`<p>Six plaques sont tirées au hasard (de 1 à 10, et 25, 50, 75, 100), ainsi qu'un nombre cible entre 101 et 999.</p><p>Avec + − × ÷ (résultats entiers positifs) et chaque plaque une seule fois, atteins la cible ou approche-t'en au plus près. Touche deux plaques et un opérateur, dans l'ordre que tu veux : pour la soustraction et la division, le plus grand nombre passe automatiquement devant. Chaque résultat intermédiaire s'affiche à droite de sa ligne et peut être sélectionné pour la suite.</p><p>Tu as 45 secondes : la manche va jusqu'au bout du temps et de la musique, mais tu peux toucher Terminer pour voir le résultat plus tôt. Ton résultat est le meilleur nombre obtenu par tes calculs.</p><p>Barème : 10 points si le compte est bon ; 7 points pour un écart de 1 à 5 ; 5 points pour un écart de 6 à 15 ; 0 point pour un écart de 16 ou plus, ou si aucun calcul n'a été proposé.</p>`},

rD:`<p>Every day at midnight (French time), five new challenges: Longest Word in French and in English (30 seconds), Countdown Numbers (45 seconds), Final Words in French and in English (2 minutes).</p><p>The draw is the same for every player and each challenge can be played only once. For Longest Word, the draw always contains at least one 10-letter word.</p><p>Leaderboards: Longest Word by the longest word found, Countdown Numbers by the result closest to the target, Final Words by the number of words found. Ties are broken by time, to the hundredth of a second (time the word was submitted, time of the best calculation, time of the last word found).</p><p>Once you have played, the draw and the solutions appear below the leaderboard. If you haven't played yet, only the leaderboard is shown. Yesterday's draw and solutions are visible to everyone in the Yesterday tab.</p><p>Leaderboards: the top 10 of all players with an account, and the ranking among friends. As a guest, you can play but your result is not ranked.</p>`,

iN:`<p>A full game in 13 rounds: one numbers round (Countdown Numbers), then two letters rounds (Longest Word), and again, 4 times in all.</p><p>The game ends with Final Words. Points from all rounds add up.</p>`,
iQ:`<p>A short game in 5 rounds: numbers, letters, numbers, letters, then Final Words.</p><p>Points from all rounds add up.</p>`,
iW:`<p>Eight scrambled words to find: 5, 6, 7 and 8 letters, then 5, 6, 7 and 8 letters again.</p><p>You have 2 minutes for the whole round. You can skip a word and come back to it later. Each correct word scores 1 point per letter.</p>`,
rW:`<p>Eight scrambled words to find: 5, 6, 7 and 8 letters, then 5, 6, 7 and 8 letters again.</p><p>You have 2 minutes for the whole game. Type your answer or tap the letters (each letter once). Each correct word scores 1 point per letter.</p><p>You can skip a word and come back to it later. Answers appear once the music has finished.</p><p>Before the game, choose the dictionary: French or English.</p>`,
rL:`<p>Ten letters are drawn: each time, you choose a vowel or a consonant (at least 2 of each).</p><p>You have 30 seconds to build the longest word you can, using each letter once. Tap Submit to propose your word: the round ends and your word scores 1 point per letter.</p><p>At the end, the longest possible word from the dictionary is revealed. French or English dictionary, your choice.</p>`,
rC:`<p>Six tiles are drawn at random (1 to 10, and 25, 50, 75, 100), along with a target between 101 and 999.</p><p>Using + − × ÷ (positive whole results only) and each tile at most once, reach the target or get as close as you can. Tap two tiles and an operator, in any order: for subtraction and division, the larger number automatically goes first. Each intermediate result appears at the right of its line and can be selected for the next step.</p><p>You have 45 seconds: the round runs until the time and the music are over, but you can tap Finish to see the result sooner. Your result is the best number reached by your calculations.</p><p>Scoring: 10 points for an exact hit; 7 points for a gap of 1 to 5; 5 points for a gap of 6 to 15; 0 points for a gap of 16 or more, or if no calculation was made.</p>`}};

 0 point.</p><p><b>Défi par lien</b> : joue une manche de Partie rapide (Le mot le plus long, Le compte est bon, Les mots de la fin ou un défi au choix), puis envoie le lien à qui tu veux. Ton adversaire joue exactement le même tirage quand il veut, une seule fois, avec ton fantôme qui lui montre où tu en étais au même moment. À la fin, il te renvoie son résultat par un lien : ouvre-le pour voir qui a gagné. À résultat égal, le plus rapide l'emporte. Tous tes duels sont dans Multijoueur › Défi par lien › Mes duels.</p>"});Object.assign(T.en,{"pM": "Multiplayer", "mM": "Multiplayer", "dM": "live or link challenge", "and": "and", "mpLive": "Create a room and invite up to 15 players: everyone plays at the same time, each on their own phone.", "mpNew": "Create a room", "mpNewS": "you are the host and choose the game", "mpJoin": "Join a room", "mpJoinS": "with the host's code or QR code", "mpCodeH": "Enter the room code given by the host, or scan their QR code with your camera.", "mpCodePh": "Room code", "mpJoinGo": "Join", "mpNameT": "Your name", "mpNameH": "It will be shown to the other players in the room.", "mpNamePh": "Your name (max 12 characters)", "mpNameE": "Your name must be 1 to 12 characters long.", "mpWhoA": "👤 Account {n}: your multiplayer results are saved", "mpWhoG": "👤 Guest: {n} (edit) · results not saved", "mpWhoG0": "👤 Guest: choose my name · results not saved", "mpCon": "Connecting to the room…", "mpNoRoom": "No open room with this code.", "mpFull": "This room is full (16 players maximum).", "mpBadCode": "The room code has 6 digits.", "mpErr": "Can't connect to the room: check your network.", "mpOff": "Multiplayer needs an internet connection: check your network and try again.", "mpRoomOf": "{n}'s room", "mpCode": "Room code", "mpShare": "Share", "mpQR": "QR code", "mpPl": "Players", "mpPlT": "Players connected: {n}/16", "mpHost": "host", "mpYou": "you", "mpOffl": "disconnected", "mpAcc": "account", "mpGst": "guest", "mpQRH": "Scan this QR code with  iQ:`<p>Une partie courte en 6 manches : chiffres, lettres, un défi tiré au hasard (thème, calcul mental, l'un dans l'autre ou orthographe), chiffres, lettres, puis Les mots de la fin.</p><p>Les points de toutes les manches s'additionnent.</p>`,
 yourW:"Ton mot :",wOk:"✓ accepté : {n} points",wKo:"✗ refusé : absent du dictionnaire (0 point)",wAccT:"Mot accepté !",wRefT:"Mot refusé",
 rM:T.fr.rM.replace("(défi thème et défi calcul mental)","(thème, calcul mental, l'un dans l'autre et orthographe)").replace("a 10 secondes pour répondre.","a 10 secondes pour répondre (15 secondes pour l'un dans l'autre et l'orthographe).").replace("défi thème, défi calcul mental ou au hasard","l'un des quatre défis ou au hasard")});
Object.assign(T.en,{dX:"4 challenges of 30 seconds",mU:"One inside the other",nU:"One inside the other",mS:"Spelling challenge",nS:"Spelling challenge",
 dfUH:"Find the proper noun (all 10 letters) and the common noun hidden in it",dfUP:"Proper noun:",dfUC:"Common noun:",dfUP0:"Proper noun (10 letters)",dfUC0:"Common noun",dfU10:"The proper noun uses all 10 letters",dfUCE:"Write the common noun too",
 dfSH:"Write the word you heard",dfListen:"🔊 Listen carefully…",dfSE:"Write the word",dfNoVoice:"Your device's voice isn't responding: use the definition.",dfWaitT:"Here comes the draw…",
 dfRulesB:"📖 Challenge rules: {n}",
 dfProc:`<h3>How it works with several players</h3><p>🔔 <b>The buzzer</b>: as soon as you have the answer, tap BUZZ. The first player to buzz stops the clock and the music, and has 10 seconds to answer (15 seconds for One inside the other and Spelling).</p><p>✓ <b>Right answer</b>: 7 points, and the challenge ends.</p><p>✗ <b>Wrong answer</b>: that player is out of the challenge and can't answer again. The clock restarts and only their opponents can still buzz.</p><p>⏱ <b>Nobody answers</b>, or everyone is wrong: nobody scores.</p>`,
 iU:`<p>A clue for a proper noun, then a clue for a common noun, then 10 letters drawn one by one: find both words. The common noun is hidden in the letters of the proper noun. 30 seconds, one answer, 7 points.</p>`,
 iS:`<p>The game says a tricky word just once: spell it correctly. 30 seconds, one answer, 7 points.</p>`,
 iT:`<p>A theme, then 10 letters drawn one by one: make two words from the theme using all the letters. 30 seconds, one answer, 7 points.</p>`,
 iK:`<p>A number then five operations, shown one after the other, each applied to the previous result: give the final result. 30 seconds, one answer, 7 points.</p>`,
 rU:`<p>Two clues appear: first one for a proper noun, then, 3 seconds later, one for a common noun. Then 10 letters are drawn one by one: they are the letters of the proper noun, jumbled. The common noun is hidden in these same letters (for example MADAGASCAR and MASCARA).</p><p>The 30-second clock starts after the last letter. Write the proper noun (all 10 letters) in the first box and the common noun in the second, then Submit. One answer only, and both words must be right: 7 points.</p><p>Accents, hyphens and spaces don't count (MARK ANTONY is written MARKANTONY). Questions in French or in English: choose the dictionary before playing.</p><p>In multiplayer, the first player to buzz stops the clock and has 15 seconds to answer. If they're wrong, they can't answer again and the others can still buzz. Nobody scores if everyone is wrong or if nobody buzzes.</p>`,
 rS:`<p>The game says a tricky word just once, using your device's voice (turn the sound up). A short definition appears to remove any doubt, then the 30-second clock starts.</p><p>Type the word with the game's keyboard, then Submit. One answer only: 7 points if the spelling is exact. Accents don't count.</p><p>Words in French or in English: choose the dictionary before playing.</p><p>In multiplayer, the first player to buzz stops the clock and has 15 seconds to type the word. If they're wrong, they can't answer again and the others can still buzz. Nobody scores if everyone is wrong or if nobody buzzes.</p>`,

 iN:`<p>A full game in 15 rounds: one numbers round (Countdown Numbers) then two letters rounds (Longest Word), twice; then two challenges picked at random from the four (rounds 7 and 8); then numbers and two letters twice more.</p><p>The game ends with Final Words. Points from all rounds add up.</p>`,

 let h=fin.map((x,i)=>(i&&x.pos>fin[i-1].pos+1?'<div class="res sep">⋯</div>':"")+row(x)).join("");
 if(cmR.sc==="top"&&nf)h='<p class="dnote">'+esc(nf>1?t("cmFinN",nf):t("cmFin1"))+"</p>"+h;
 if(run.length)h+='<h3 class="mph">'+t(past?"cmNoFin":"cmRun")+"</h3>"+run.map(row).join("");
 if(!list.length)h='<p class="dnote">'+t("cmNone")+"</p>";
 if(cmR.sc==="friends"&&list.filter(x=>!x.me).length===0)h+='<p class="dnote" style="margin-top:10px">'+t("cmFr0")+"</p>";
 $("cmRkL").innerHTML=h;
 if(past&&st){const dr={},my={};(st.draws||[]).forEach(z=>dr[z.idx]=z.d);(st.plays||[]).forEach(z=>my[z.idx]=z);let o="<h3>"+t("cmSolT")+"</h3>";
  for(let i=0;i<10;i++){const d=dr[i];if(!d)continue;const p=my[i];
   o+='<div class="tbe"><h3>'+t("cmEp",i+1,10)+" · "+esc(cmLbl(i,d.g))+"</h3>"+cmSolH(d,LG)+'<div class="res me"><span class="rn">'+t("cmMe")+'</span><span class="rv"><b>'+(!p?t("cmNoPl"):p.done&&p.ok?'<span class="ok">✓ '+fmtCM(p.ms)+"</span>"+(p.ans&&d.g!=="c"?" · "+(dfIs(d.g)?dfUp(p.ans):esc(String(p.ans).toUpperCase())):""):'<span class="ko">✗</span> '+fmtCM(cmMax(i)))+"</b></span></div></div>"}
  $("cmRkS").innerHTML=o+wdHint()}}
function cmSolH(d,lg){if(d.g==="c")return'<div class="plates">'+d.P.map(v=>'<div class="plate" style="cursor:default">'+v+"</div>").join("")+'</div><div class="tgt">'+String(d.tgt).split("").map(x=>"<b>"+x+"</b>").join("")+'</div><p style="text-align:center;color:var(--mut)">'+t("solution")+"</p>"+solHTML(solve(d.P,d.tgt));
 if(d.g==="a")return dfTilesH(d.l||[])+'<p style="text-align:center">'+t("cmWord")+" <b>"+wdH(d.w,lg)+"</b></p>";
 try{return dfSolHTML(d)}catch(e){return""}}
$("cmRkSel").onchange=e=>cmRank(+e.target.value);$("cmRkPrev").onclick=()=>cmRank(cmR.s-1);$("cmRkNext").onclick=()=>cmRank(cmR.s+1);
all("#cmRkLg [data-cmrl]").forEach(b=>b.onclick=()=>cmRank(cmR.s,b.dataset.cmrl));
all("#cmRkTabs [data-cmsc]").forEach(b=>b.onclick=()=>{cmR.sc=b.dataset.cmsc;cmRank(cmR.s)});

function cmLang(){if(!$("cmP").classList.contains("hide"))renderCm();else if(!$("cmRkP").classList.contains("hide"))cmRank(cmR.s);else if(!$("cmAn").classList.contains("hide")){const i=parseInt(($("cmAT").textContent.match(/\d+/)||[])[0],10);if(i)cmAnnShow(i-1)}
 if(cmx&&!$("end").classList.contains("hide")&&cmx.sent)$("tomenu").textContent=t("cmBackB")}
["cmP","cmRkP","cmAn"].forEach(id=>HBP.add(id));
// ----- v19.1 : statistiques du contre-la-montre -----
Object.assign(T.fr,{cmStS:"temps, réussite par épreuve, saisons",cmStN:"Statistiques du compte {n}, en français et en anglais.",cmStG:"Le contre-la-montre se joue avec un compte : connecte-toi pour voir tes statistiques.",
 cmSt0:"Aucune épreuve jouée pour l'instant. Lance-toi !",cmStRaces:"Courses",cmStSeas:"Saisons jouées",cmStFin:"Courses terminées",cmStEp:"Épreuves jouées",cmStOk:"Réussite",
 cmStBest:"Meilleur temps",cmStAvg:"Temps moyen",cmStPos:"Meilleure place",cmStWin:"Victoires",cmStPod:"Podiums",cmStPosN:"Places des saisons terminées.",
 cmStByEp:"Par épreuve",cmStByEpN:"Réussite, puis temps moyen des bonnes réponses.",cmStHist:"Saison par saison",cmStErr:"Statistiques indisponibles (vérifie ta connexion)."});
Object.assign(T.en,{cmStS:"times, success per round, seasons",cmStN:"Stats for the account {n}, in French and in English.",cmStG:"The Time Trial is played with an account: log in to see your stats.",
 cmSt0:"No rounds played yet. Give it a go!",cmStRaces:"Races",cmStSeas:"Seasons played",cmStFin:"Races finished",cmStEp:"Rounds played",cmStOk:"Success",
 cmStBest:"Best time",cmStAvg:"Average time",cmStPos:"Best place",cmStWin:"Wins",cmStPod:"Podiums",cmStPosN:"Places in finished seasons.",
 cmStByEp:"By round",cmStByEpN:"Success rate, then average time of right answers.",cmStHist:"Season by season",cmStErr:"Stats unavailable (check your connection)."});
let CMSD=null,cmStTok=0;
async function cmStLoad(){if(!ME||!sb||!SESS){CMSD=null;return}const id=ME.id,tok=++cmStTok;let d=null,err=false;
 try{try{await cmFlush()}catch(e){}const r=await sb.rpc("cm_my_stats");if(r.error)throw r.error;d=r.data||{}}catch(e){err=true}
 if(tok===cmStTok&&ME&&ME.id===id)CMSD={id,err,cur:d&&d.cur||cmCur(),seasons:d&&d.seasons||[],plays:d&&d.plays||[]}}
function renderCmSt(){const B=$("cmStS");$("cmStN").textContent=ME?t("cmStN",ME.pseudo):"";
 if(!ME){B.innerHTML='<p class="dnote">'+t("cmStG")+"</p>";return}
 const M=CMSD&&CMSD.id===ME.id?CMSD:null;if(!M){B.innerHTML='<p class="dnote">'+t("frLoad")+"</p>";return}
 if(M.err){B.innerHTML='<p class="dnote">'+t("cmStErr")+"</p>";return}
 const S=M.seasons,P=M.plays,LG=["fr","en"],cur=M.cur;if(!P.length){B.innerHTML='<p class="dnote">'+t("cmSt0")+"</p>";return}
 const fin=S.filter(x=>x.n>=10),okN=P.filter(x=>x.ok).length,dash="—";let h="";
 // général
 h+="<h3>"+t("sGen")+"</h3>"+sg([tile(new Set(S.map(x=>x.season)).size,t("cmStSeas")),tile(fin.length,t("cmStFin")),tile(P.length,t("cmStEp")),tile(pc(okN,P.length),t("cmStOk"),okN+" / "+P.length)]);
 // les courses, en français et en anglais
 const col=f=>LG.map(lg=>{const s=S.filter(x=>x.lang===lg);return s.length?f(s,lg):dash});
 const ended=s=>s.filter(x=>x.season<cur&&x.pos);
 h+="<h3>"+t("cmStRaces")+"</h3>"+stb(["",FLAG.fr,FLAG.en],[
  [t("cmStSeas"),...col(s=>s.length)],
  [t("cmStFin"),...col(s=>s.filter(x=>x.n>=10).length)],
  [t("cmStBest"),...col(s=>{const f=s.filter(x=>x.n>=10);return f.length?"<b>"+fmtCM(Math.min(...f.map(x=>+x.total_ms)))+"</b>":dash})],
  [t("cmStAvg"),...col(s=>{const f=s.filter(x=>x.n>=10);return f.length?fmtCM(avg(f.map(x=>+x.total_ms))):dash})],
  [t("cmStPos"),...col(s=>{const e=ended(s);if(!e.length)return dash;const b=e.reduce((a,x)=>x.pos<a.pos?x:a);return ordN(b.pos)+" <small>/ "+b.nfin+"</small>"})],
  [t("cmStWin"),...col(s=>ended(s).filter(x=>x.pos===1).length)],
  [t("cmStPod"),...col(s=>ended(s).filter(x=>x.pos<=3).length)]])+'<p class="dnote">'+t("cmStPosN")+"</p>";
 // par épreuve
 const rows=[[t("nC"),x=>x.g==="c"],...[5,6,7,8].map(n=>[t("cmA",n),x=>x.g==="a"&&CML[x.idx]===n]),...DF5.map(g=>[t("m"+g.toUpperCase()),x=>x.g===g])];
 h+="<h3>"+t("cmStByEp")+"</h3>"+stb(["",FLAG.fr,FLAG.en],rows.map(([l,f])=>[l,...LG.map(lg=>{const a=P.filter(x=>x.lang===lg&&f(x)),o=a.filter(x=>x.ok);
  return a.length?"<b>"+pc(o.length,a.length)+"</b>"+(o.length?"<br><small>"+fmtCM(avg(o.map(x=>x.ms)))+"</small>":""):dash})]).filter(r=>r.slice(1).some(c=>c!==dash)))+'<p class="dnote">'+t("cmStByEpN")+"</p>";
 // saison par saison
 const ss=[...new Set(S.map(x=>x.season))].sort((a,b)=>b-a);
 h+="<h3>"+t("cmStHist")+"</h3>"+stb(["",FLAG.fr,FLAG.en],ss.map(n=>[t("cmSeason",n)+(n===cur?"<br><small>"+t("cmCur")+"</small>":""),...LG.map(lg=>{const x=S.find(z=>z.season===n&&z.lang===lg);if(!x)return dash;
  if(x.n>=10)return"<b>"+fmtCM(+x.total_ms)+"</b>"+(x.pos?"<br><small>"+ordN(x.pos)+" / "+x.nfin+"</small>":"");return x.n+"/10"+(n<cur?"<br><small>"+t("cmNoFin")+"</small>":"")})]));
 B.innerHTML=h}
function openCmSt(){renderCmSt();show("cmStP");if(ME)cmStLoad().then(()=>{if(!$("cmStP").classList.contains("hide"))renderCmSt()})}
$("stCm").onclick=openCmSt;HBP.add("cmStP");


applyLang();loadSB();
